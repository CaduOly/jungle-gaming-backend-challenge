# Keycloak, só com o profile `auth`, em cima da rede da stack da aplicação. Um client confidencial por game
# provider (client_credentials), e cada token carrega a claim `provider_id` e a audience `wagering-api`.
#   docker compose -f docker-compose.auth.yml --profile auth up -d
# Aí as réplicas rodam com AUTH_MODE=jwks (ver .env.example). O KC_HOSTNAME fixa o issuer na URL que os
# providers usam, então um token pego do host e um pego dentro da rede têm o mesmo `iss`.
name: jungle-wagering-auth

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    profiles: [auth]
    command: [start-dev, --import-realm, --health-enabled=true]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8081}:8080"
    volumes:
      - ./infra/keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
    networks: [infra]

networks:
  infra:
    name: jungle-wagering_default
    external: true
