# Keycloak, só com o profile `auth`. Um client confidencial por game provider (client_credentials), e cada
# token carrega a claim `provider_id` e a audience `wagering-api`.
#   AUTH_MODE=jwks docker compose --profile auth up -d --build
# O KC_HOSTNAME fixa o issuer na URL que os providers usam, então um token pego do host e um pego dentro da rede
# têm o mesmo `iss`.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    profiles: [auth]
    command: [start-dev, --import-realm, --health-enabled=true]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8081}:8080"
    volumes:
      - ./infra/keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
