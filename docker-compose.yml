name: jungle-wagering

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.4.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SQS_ENDPOINT_STRATEGY: path
      EAGER_SERVICE_LOADING: "1"
      LOCALSTACK_HOST: localhost:${LOCALSTACK_HOST_PORT:-4566}
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566"
    volumes:
      - ./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
      - ./infra/localstack/healthcheck.sh:/usr/local/bin/wagering-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/wagering-healthcheck.sh"]
      interval: 3s
      timeout: 10s
      start_period: 60s
      retries: 40

volumes:
  postgres-data:
