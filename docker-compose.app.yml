# The application over the infrastructure stack of docker-compose.yml (project jungle-wagering): it joins that
# stack's network and reaches PostgreSQL and LocalStack by their service names. Start the infrastructure first:
#   docker compose up -d
#   docker compose -f docker-compose.app.yml up -d --build
name: jungle-wagering-app

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering}@postgres:5432/${POSTGRES_DB:-wagering}
  SQS_ENDPOINT: http://localstack:4566
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}

services:
  migrate:
    build: .
    image: jungle-wagering-app:local
    command: ["bun", "run", "migrate"]
    environment: *app-env
    networks: [infra]
    restart: "no"

  app:
    image: jungle-wagering-app:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      APP_ROLES: api,consumer,outbox,pending-worker
      PORT: "3000"
      SHUTDOWN_TIMEOUT_MS: "25000"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    stop_grace_period: 30s
    networks: [infra]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [infra]

networks:
  infra:
    name: jungle-wagering_default
    external: true
