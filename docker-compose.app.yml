# A aplicação em cima da stack de infraestrutura do docker-compose.yml (project jungle-wagering): ela entra na rede
# dessa stack e acessa o PostgreSQL e o LocalStack pelo nome do serviço. Suba a infraestrutura antes:
#   docker compose up -d
#   docker compose -f docker-compose.app.yml up -d --build
# Prometheus e Grafana sobem junto (docker-compose.observability.yml). O Keycloak só com o profile `auth`
# (docker-compose.auth.yml), e aí as réplicas precisam de AUTH_MODE=jwks:
#   AUTH_MODE=jwks docker compose -f docker-compose.app.yml --profile auth up -d --build
name: jungle-wagering-app

include:
  - docker-compose.observability.yml
  - docker-compose.auth.yml

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering}@postgres:5432/${POSTGRES_DB:-wagering}
  SQS_ENDPOINT: http://localstack:4566
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AUTH_MODE: ${AUTH_MODE:-noop}
  AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://keycloak:8080/realms/wagering/protocol/openid-connect/certs}
  AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8081/realms/wagering}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-wagering-api}

services:
  migrate:
    build:
      context: .
      # o bun install resolve o registry do npm pelo DNS do host (a bridge padrão do build pode não resolver).
      network: host
    image: jungle-wagering-app:local
    command: ["bun", "run", "migrate"]
    environment: *app-env
    networks: [infra]
    restart: "no"

  app:
    image: jungle-wagering-app:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      APP_ROLES: api,consumer,outbox,pending-worker
      PORT: "3000"
      SHUTDOWN_TIMEOUT_MS: "25000"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    stop_grace_period: 30s
    networks: [infra]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [infra]

networks:
  infra:
    name: jungle-wagering_default
    external: true
