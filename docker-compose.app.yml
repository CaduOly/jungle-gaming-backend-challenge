# A aplicação: migrations, 3 réplicas com todos os papéis e o nginx na frente. Entra no docker-compose.yml
# pelo `include`, então sobe junto com a infraestrutura num `docker compose up -d --build` só.
# Prometheus, Grafana (docker-compose.observability.yml) e Keycloak (docker-compose.auth.yml) vêm junto. As réplicas
# exigem token do Keycloak, como em produção. Para pular o IdP só em dev:
#   AUTH_MODE=noop docker compose up -d --build --wait
include:
  - docker-compose.observability.yml
  - docker-compose.auth.yml

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering}@postgres:5432/${POSTGRES_DB:-wagering}
  SQS_ENDPOINT: http://localstack:4566
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AUTH_MODE: ${AUTH_MODE:-jwks}
  # Fixo no nome do serviço: o AUTH_JWKS_URL do .env aponta para o localhost, que é o que o `start:dev` usa
  AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
  AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8081/realms/wagering}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-wagering-api}

services:
  migrate:
    build:
      context: .
    image: jungle-wagering-app:local
    command: ["bun", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    restart: "no"

  app:
    image: jungle-wagering-app:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    environment:
      <<: *app-env
      APP_ROLES: api,consumer,outbox,pending-worker
      PORT: "3000"
      SHUTDOWN_TIMEOUT_MS: "25000"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    stop_grace_period: 30s

  nginx:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
