# Scrapes every replica of the `app` service: Docker's DNS answers the service name with one A record per replica,
# so scaling the service up or down needs no change here.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: wagering
    metrics_path: /metrics
    dns_sd_configs:
      - names: [app]
        type: A
        port: 3000
        refresh_interval: 10s
