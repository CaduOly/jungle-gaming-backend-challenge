# O DNS embutido do Docker responde `app` com todas as réplicas. O `resolve` fica relendo, então uma réplica
# recriada (IP novo) ou removida no scale é percebida sem reiniciar o nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream wagering {
  zone wagering 64k;
  server app:3000 resolve max_fails=1 fail_timeout=2s;
  keepalive 32;
}

server {
  listen 80;

  location / {
    proxy_pass http://wagering;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Se a réplica recusa a conexão ou estoura o timeout, a requisição vai para a próxima; um 503 da própria
    # aplicação (banco fora) passa direto com o Retry-After dele.
    proxy_next_upstream error timeout;
    proxy_read_timeout 15s;
  }
}
