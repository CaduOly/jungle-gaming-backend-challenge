upstream wagering {
  # Docker's DNS returns every replica of the service; nginx spreads the requests over them.
  server app:3000 max_fails=1 fail_timeout=2s;
  keepalive 32;
}

server {
  listen 80;

  location / {
    proxy_pass http://wagering;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A replica that answers 502/503 on connect gets the request moved to the next one; a 503 from the
    # application itself (database down) is passed through with its Retry-After.
    proxy_next_upstream error timeout;
    proxy_read_timeout 15s;
  }
}
