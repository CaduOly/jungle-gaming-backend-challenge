# Docker's embedded DNS answers `app` with every replica. `resolve` keeps re-reading it, so a replica that is
# recreated (new IP) or scaled in is picked up without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream wagering {
  zone wagering 64k;
  server app:3000 resolve max_fails=1 fail_timeout=2s;
  keepalive 32;
}

server {
  listen 80;

  location / {
    proxy_pass http://wagering;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A replica that refuses the connection or times out gets the request moved to the next one; a 503 from the
    # application itself (database down) is passed through with its Retry-After.
    proxy_next_upstream error timeout;
    proxy_read_timeout 15s;
  }
}
